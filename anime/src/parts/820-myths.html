<section class="sec" id="myths" style="--era:#a07bf2" aria-labelledby="myths-title">
  <div class="wrap">
    <div class="sec-head">
      <div><span class="label">Myths and facts</span><h2 id="myths-title">Six things people get wrong</h2></div>
      <span class="p">Each card shows a common claim. Turn it over for what the record says.</span>
    </div>
    <div class="myths">
      <button type="button" class="myth" aria-pressed="false"><span class="myth-in">
        <span class="myth-f"><span class="label">Myth</span><span class="p">“Anime is a genre.”</span><span class="turn">Turn over</span></span>
        <span class="myth-b"><span class="label">Fact</span><span class="p">It is a medium and an industry. It has held boxing melodramas, war films, comedies, horror, sports dramas, quiet domestic stories and philosophical science fiction. What genres it has, it has in common with cinema and literature.</span></span>
      </span></button>
      <button type="button" class="myth" aria-pressed="false"><span class="myth-in">
        <span class="myth-f"><span class="label">Myth</span><span class="p">“Astro Boy was the first anime TV series.”</span><span class="turn">Turn over</span></span>
        <span class="myth-b"><span class="label">Fact</span><span class="p">Ryūichi Yokoyama's short <i>Instant History</i> (1961) and <i>Otogi Manga Calendar</i> (1962) aired first. <i>Astro Boy</i> (1963) was the first weekly, half-hour animated series, the format that became the industry.</span></span>
      </span></button>
      <button type="button" class="myth" aria-pressed="false"><span class="myth-in">
        <span class="myth-f"><span class="label">Myth</span><span class="p">“The big eyes are there to make characters look Western.”</span><span class="turn">Turn over</span></span>
        <span class="myth-b"><span class="label">Fact</span><span class="p">The look traces largely to Osamu Tezuka, who adored Disney and the Fleischers' Betty Boop and grew up near the Takarazuka Revue, whose performers wore large, sparkling stage eyes. Many scholars argue anime faces are designed to be <i>mukokuseki</i>, “stateless”, rather than of any race.</span></span>
      </span></button>
      <button type="button" class="myth" aria-pressed="false"><span class="myth-in">
        <span class="myth-f"><span class="label">Myth</span><span class="p">“Grave of the Fireflies is simply an anti-war film.”</span><span class="turn">Turn over</span></span>
        <span class="myth-b"><span class="label">Fact</span><span class="p">Isao Takahata repeatedly rejected the label. He said he wanted to show a boy and his sister who die after cutting themselves off from the people around them, a warning aimed at young viewers of the 1980s. The film works powerfully as an anti-war film anyway. Both readings can stand.</span></span>
      </span></button>
      <button type="button" class="myth" aria-pressed="false"><span class="myth-in">
        <span class="myth-f"><span class="label">Myth</span><span class="p">“Anime only went global with streaming.”</span><span class="turn">Turn over</span></span>
        <span class="myth-b"><span class="label">Fact</span><span class="p"><i>Astro Boy</i> reached American television in 1963, the year it began in Japan. By the late 1970s <i>Grendizer</i> was a phenomenon in France and across the Arab world, and <i>Heidi</i> a childhood staple in much of Europe, often with viewers unaware the shows were Japanese. Streaming made anime easier to find, and to watch on the day it airs in Japan.</span></span>
      </span></button>
      <button type="button" class="myth" aria-pressed="false"><span class="myth-in">
        <span class="myth-f"><span class="label">Myth</span><span class="p">“Limited animation is just cheap animation.”</span><span class="turn">Turn over</span></span>
        <span class="myth-b"><span class="label">Fact</span><span class="p">It began as economy, but directors such as Osamu Dezaki turned holds, stills and repetition into a language of emphasis. Media scholars such as Thomas Lamarre argue it produced a distinct way of seeing, with depth made from sliding layers rather than a moving camera.</span></span>
      </span></button>
    </div>
  </div>
</section>
