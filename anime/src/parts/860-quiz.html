<section class="sec" id="quiz" style="--era:#f2a541" aria-labelledby="quiz-title">
  <div class="wrap">
    <div class="sec-head">
      <div><span class="label">Test yourself</span><h2 id="quiz-title">Ten questions, one per reel and interlude</h2></div>
      <p>Recalling what you have read is one of the most reliable ways to remember it. Each answer comes with an explanation and a link back to the part of the history it covers.</p>
    </div>
    <div class="quiz" data-quiz>
      <div class="quiz-top"><span data-quiz-count>Question 1 of 10</span><span class="quiz-progress" aria-hidden="true"><i data-quiz-bar></i></span><span data-quiz-score>Score 0</span></div>
      <div class="quiz-body" data-quiz-body aria-live="polite">
        <noscript><p>The quiz needs JavaScript. The answers are all in the reels above.</p></noscript>
      </div>
    </div>
    {{quizdata}}
  </div>
</section>
