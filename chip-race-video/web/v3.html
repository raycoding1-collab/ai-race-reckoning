<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { TTFLoader } from "three/addons/loaders/TTFLoader.js";
import { Font } from "three/addons/loaders/FontLoader.js";
import { TextGeometry } from "three/addons/geometries/TextGeometry.js";

const W = 1920, H = 1080, TLD = window.TL, BEAT = TLD.beat, BAR = TLD.bar;
const barT = (b, beat = 0) => b * BAR + beat * BEAT;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut3 = x => 1 - Math.pow(1 - x, 3), eIn3 = x => x * x * x;
const eIO3 = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eOutBack = x => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const L = n => TLD.lines.find(l => l.scene === n);
const wd = (n, i) => L(n).words[i];
const AMBER = 0xffa41b, AMBER_S = "#FFA41B", INK = "#EDE8DE", HOT = "#FFCF70";

// ===================================================================== renderer
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const pmrem = new THREE.PMREMGenerator(renderer);
const ENV = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const ov = document.getElementById("ov"), ctx = ov.getContext("2d");
const ovTex = new THREE.CanvasTexture(ov); ovTex.colorSpace = THREE.NoColorSpace;

const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(new THREE.Scene(), new THREE.PerspectiveCamera());
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.5, 0.4, 0.82);
const finalPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, tOv: { value: ovTex }, uTime: { value: 0 }, uCA: { value: 0.0015 },
    uFlash: { value: 0 }, uGrain: { value: 0.07 }, uVig: { value: 0.55 }, uInvert: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse, tOv; uniform float uTime, uCA, uFlash, uGrain, uVig, uInvert; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){
      vec2 d = vUv - .5; float r = length(d);
      vec3 c;
      c.r = texture2D(tDiffuse, vUv + d * uCA * 6.).r; c.g = texture2D(tDiffuse, vUv).g; c.b = texture2D(tDiffuse, vUv - d * uCA * 6.).b;
      c = mix(c, 1. - c, uInvert);
      vec4 o = texture2D(tOv, vUv);
      c = mix(c, o.rgb, o.a);
      c = mix(c, vec3(1., .98, .94), uFlash);
      c *= 1. - uVig * smoothstep(.35, .95, r);
      c += (h(vUv * 1000. + uTime) - .5) * uGrain;
      gl_FragColor = vec4(c, 1.);
    }` });
composer.addPass(renderPass); composer.addPass(bloom); composer.addPass(new OutputPass()); composer.addPass(finalPass);

// ===================================================================== shared assets
function canvasTex(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
const glowTex = canvasTex(256, 256, (g, w) => { const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2); r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(.2, "rgba(255,220,150,.8)"); r.addColorStop(.5, "rgba(255,150,30,.25)"); r.addColorStop(1, "rgba(255,120,0,0)"); g.fillStyle = r; g.fillRect(0, 0, w, w); });
const sprite = (scale = 1, color = 0xffffff) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true })); s.scale.setScalar(scale); return s; };
const metal = (color = 0x9a9a9a, rough = 0.2) => new THREE.MeshStandardMaterial({ color, metalness: 1, roughness: rough, envMap: ENV, envMapIntensity: 1.0 });
const emissive = (color = AMBER, i = 3) => new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(i), toneMapped: false });

function textTex(str, { size = 200, weight = 900, stretch = "normal", color = INK, fam = "Archivo", italic = false, pad = 40 } = {}) {
  const m = document.createElement("canvas").getContext("2d");
  m.font = `${italic ? "italic " : ""}${weight} ${size}px ${fam}`; m.fontStretch = stretch;
  const w = Math.ceil(m.measureText(str).width + pad * 2), h = Math.ceil(size * 1.3 + pad * 2);
  const tex = canvasTex(w, h, (g) => { g.font = m.font; g.fontStretch = stretch; g.fillStyle = color; g.textBaseline = "middle"; g.fillText(str, pad, h / 2); });
  return { tex, aspect: w / h };
}
function textPlane(str, height, opts = {}) {
  const { tex, aspect } = textTex(str, opts);
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, toneMapped: false, blending: opts.add ? THREE.AdditiveBlending : THREE.NormalBlending });
  if (opts.boost) mat.color.setScalar(opts.boost);
  return new THREE.Mesh(new THREE.PlaneGeometry(height * aspect, height), mat);
}

// procedural noise (deterministic)
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const s = v => v * v * (3 - 2 * v);
  const a = hash(xi * 57 + yi * 131), b = hash(xi + 1 + yi * 131 + 57), c = hash(xi * 57 + (yi + 1) * 131), d = hash(xi * 57 + 57 + (yi + 1) * 131);
  return lerp(lerp(a, b, s(xf)), lerp(c, d, s(xf)), s(yf)); }
const fbm = (x, y) => vnoise(x, y) * .5 + vnoise(x * 2.1, y * 2.1) * .25 + vnoise(x * 4.3, y * 4.3) * .125;

// living plasma shader
const plasmaMat = (hot = 1) => new THREE.ShaderMaterial({
  uniforms: { uT: { value: 0 }, uHot: { value: hot }, uA: { value: 1 } }, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  vertexShader: `varying vec3 vN; varying vec3 vP; void main(){ vN = normalize(normalMatrix * normal); vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform float uT, uHot, uA; varying vec3 vN; varying vec3 vP;
    float hs(vec3 p){ return fract(sin(dot(p, vec3(17.1, 31.7, 11.3))) * 43758.5); }
    float n3(vec3 p){ vec3 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
      return mix(mix(mix(hs(i), hs(i+vec3(1,0,0)), f.x), mix(hs(i+vec3(0,1,0)), hs(i+vec3(1,1,0)), f.x), f.y),
                 mix(mix(hs(i+vec3(0,0,1)), hs(i+vec3(1,0,1)), f.x), mix(hs(i+vec3(0,1,1)), hs(i+vec3(1,1,1)), f.x), f.y), f.z); }
    void main(){ float fres = pow(1. - abs(vN.z), 1.6);
      vec3 p = normalize(vP) * 2.5; float n = n3(p + uT * .9) * .55 + n3(p * 2.3 - uT * 1.4) * .3 + n3(p * 5. + uT * 2.) * .15;
      float e = smoothstep(.25, .9, n) * (0.5 + 0.8 * (1. - fres));
      vec3 col = mix(vec3(1., .35, .02), vec3(1., .85, .5), e) * (1.5 + 3. * e) * uHot;
      gl_FragColor = vec4(col * (0.35 + e) * uA, (0.4 + e) * uA); }` });

// ===================================================================== font for extruded type
let FONT3D = null;

// ===================================================================== wafer
function dieTextures() {
  const S = 1024, R = S / 2 - 6, dw = 40, dh = 32, cells = [];
  for (let y = -R; y < R; y += dh) for (let x = -R; x < R; x += dw) {
    if ([[x, y], [x + dw, y], [x, y + dh], [x + dw, y + dh]].every(([a, b]) => a * a + b * b < (R - 14) ** 2)) cells.push([x + S / 2, y + S / 2]);
  }
  const base = canvasTex(S, S, (g) => {
    const gr = g.createLinearGradient(0, 0, S, S); gr.addColorStop(0, "#3a3a3e"); gr.addColorStop(.5, "#8a8a92"); gr.addColorStop(1, "#2c2c30");
    g.fillStyle = gr; g.fillRect(0, 0, S, S);
    cells.forEach(([x, y], i) => { g.fillStyle = `rgba(${150 + hash(i) * 40},${150 + hash(i + 1) * 40},${160 + hash(i + 2) * 40},1)`; g.fillRect(x + 2, y + 2, dw - 4, dh - 4);
      g.fillStyle = "rgba(40,40,46,.6)"; for (let k = 0; k < 4; k++) g.fillRect(x + 6 + k * 8, y + 6, 4, dh - 12); });
  });
  const em = document.createElement("canvas"); em.width = em.height = 512;
  const emTex = new THREE.CanvasTexture(em); emTex.colorSpace = THREE.SRGBColorSpace;
  let lastLit = -1;
  function setLit(frac, accent = 0) {
    const n = Math.floor(cells.length * frac), key = n * 1000 + Math.round(accent * 100);
    if (key === lastLit) return; lastLit = key;
    const g = em.getContext("2d"); g.fillStyle = "#000"; g.fillRect(0, 0, 512, 512);
    cells.forEach(([x, y], i) => {
      const fresh = clamp(1 - (n - i) / 24), on = i < n;
      const hot = accent > 0 && hash(i * 7.7) < accent;
      if (!on && !hot) return;
      const a = hot ? 0.9 : 0.12 + 0.88 * fresh;
      g.fillStyle = `rgba(255,${150 + 60 * fresh},30,${a})`; g.fillRect((x + 3) / 2, (y + 3) / 2, (dw - 6) / 2, (dh - 6) / 2);
    });
    emTex.needsUpdate = true;
  }
  return { base, emTex, setLit };
}
function makeWafer() {
  const tx = dieTextures();
  const top = new THREE.MeshPhysicalMaterial({ map: tx.base, metalness: 0.9, roughness: 0.16, envMap: ENV, envMapIntensity: 1.3,
    iridescence: 1, iridescenceIOR: 1.8, iridescenceThicknessRange: [250, 900], emissive: new THREE.Color(1, 0.6, 0.15), emissiveMap: tx.emTex, emissiveIntensity: 2.2 });
  const side = metal(0x777777, 0.3);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 0.05, 180, 1), [side, top, side]);
  const g = new THREE.Group(); g.add(m); g.setLit = tx.setLit; g.top = top;
  return g;
}

// ===================================================================== scenes
const scenes = {};
function mk(name, fogDensity = 0) {
  const s = new THREE.Scene(); s.background = new THREE.Color(0x050505);
  if (fogDensity) s.fog = new THREE.FogExp2(0x050505, fogDensity);
  const cam = new THREE.PerspectiveCamera(38, W / H, 0.05, 500);
  scenes[name] = { scene: s, cam }; return scenes[name];
}
const shake = (t, amt, f = 30) => [(vnoise(t * f, 1.3) - .5) * amt, (vnoise(t * f, 7.1) - .5) * amt];

// ---------- WAFER STAGE (intro, drop, tag, end) ----------
function buildWafer() {
  const S = mk("wafer");
  const wafer = makeWafer(); S.scene.add(wafer);
  const key = new THREE.SpotLight(AMBER, 260, 40, 0.5, 0.6); key.position.set(6, 6, 4); S.scene.add(key, key.target);
  const rim = new THREE.PointLight(0xffffff, 60, 30); rim.position.set(-5, 3, -4); S.scene.add(rim);
  S.scene.add(new THREE.AmbientLight(0xffffff, 0.05));
  const dot = sprite(0.5, AMBER); S.scene.add(dot);
  S.update = (t, mode) => {
    const c = S.cam;
    dot.visible = false; wafer.top.envMapIntensity = mode === "drop" || mode === "now" ? 1.3 : 0.45; wafer.top.roughness = mode === "drop" || mode === "now" ? 0.16 : 0.32;
    if (mode === "intro") {
      const p = prog(t, 0, barT(2));
      const ang = lerp(-0.6, 0.5, eIO3(p)), dist = lerp(4.2, 7.5, eOut3(p)), hgt = lerp(0.25, 3.6, eIO3(p));
      const rush = eIn3(prog(t, barT(2) - 0.45, barT(2)));
      c.position.set(Math.sin(ang) * dist * (1 - 0.8 * rush), hgt * (1 - 0.6 * rush) + 0.05, Math.cos(ang) * dist * (1 - 0.8 * rush));
      c.lookAt(0, 0, 0);
      wafer.rotation.set(0, t * 0.15, 0);
      wafer.setLit(eIn3(prog(t, 0.8, 3.3)));
      key.intensity = 80 * eOut3(prog(t, 0.0, 1.0)); key.position.set(Math.cos(t * 0.9) * 7, 5, Math.sin(t * 0.9) * 7);
      dot.visible = t < 0.9; dot.position.set(0, 0.08, 3.0); dot.scale.setScalar(0.4 + 0.3 * Math.sin(t * 18));
    } else if (mode === "drop") {
      const lt = t - wd("wafer", 1).t;
      c.position.set(Math.sin(lt * 0.3) * 1.2, 7.5 - lt * 0.4, 1.6); c.lookAt(0, 0, 0);
      wafer.rotation.set(0, -lt * 0.5, 0); wafer.setLit(1, 0.12);
      key.intensity = 500; key.position.set(5, 7, 3 + lt * 2);
    } else if (mode === "now") {
      const lt = t - wd("wafer", 5).t, k = kick(t);
      c.position.set(0, 9.5 - lt * 1.1, 0.01); c.lookAt(0, 0, 0); c.rotation.z = lt * 0.12;
      wafer.rotation.set(0, lt * 0.25, 0); wafer.setLit(1, 0.05 + 0.6 * clamp(lt / 1.8) * (0.4 + 0.6 * k));
      key.intensity = 600 + 600 * k; key.position.set(Math.cos(lt * 2) * 6, 7, Math.sin(lt * 2) * 6);
    } else if (mode === "tag" || mode === "end") {
      const lt = t - barT(20);
      c.position.set(Math.sin(lt * 0.2 + 1) * 6.5, 2.2 + lt * 0.15, Math.cos(lt * 0.2 + 1) * 6.5); c.lookAt(0, -0.3, 0);
      wafer.rotation.set(0, lt * 0.1, 0); wafer.setLit(1, 0.02);
      key.intensity = mode === "end" ? 140 : 80 * (1 - prog(t, barT(21) + 0.6, barT(22)));
      key.position.set(-6, 6, 2);
    }
  };
}

// ---------- TIN: droplets + plasma bursts ----------
function buildTin() {
  const S = mk("tin");
  const focus = new THREE.Vector3(0, 0, 0);
  const drops = new THREE.InstancedMesh(new THREE.SphereGeometry(0.085, 32, 16), metal(0xe8edf4, 0.14), 18); S.scene.add(drops);
  for (let i = 0; i < 9; i++) { const b = sprite(1.5 + hash(i) * 2.5, i % 3 ? AMBER : 0xffffff); b.material.opacity = 0.12 + 0.12 * hash(i + 4);
    b.position.set(-3 + hash(i + 1) * 4, -1 + hash(i + 2) * 3, -4 - hash(i + 3) * 4); S.scene.add(b); }
  const ringGeo = new THREE.RingGeometry(0.95, 1, 96);
  const bursts = [...Array(3)].map(() => {
    const g = new THREE.Group(); const sp = sprite(1, 0xffffff); const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: AMBER, transparent: true, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false }));
    g.add(sp, ring); g.sp = sp; g.ring = ring; S.scene.add(g); return g; });
  const NP = 900, pg = new THREE.BufferGeometry(); pg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(NP * 3), 3));
  const pts = new THREE.Points(pg, new THREE.PointsMaterial({ color: 0xffc060, size: 0.035, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false })); S.scene.add(pts);
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 20, 8), emissive(AMBER, 4)); beam.rotation.z = Math.PI / 2 - 0.12; beam.position.set(10, 1.2, 0); S.scene.add(beam);
  const flashL = new THREE.PointLight(0xffb040, 0, 20); flashL.position.set(0.3, 0.05, 0.45); S.scene.add(flashL);
  const keyT = new THREE.DirectionalLight(0xffffff, 2.5); keyT.position.set(-3, 4, 3); S.scene.add(keyT);
  const dummy = new THREE.Object3D();
  S.update = (t) => {
    const t0 = barT(2), lt = t - t0, step = BEAT / 4, k = Math.floor(lt / step), ph = (lt % step) / step;
    const c = S.cam; const a = 0.5 + lt * 0.12;
    c.position.set(0.55 + Math.sin(lt * 0.4) * 0.15, 0.2 + lt * 0.04, 1.15); c.lookAt(-0.3, 0.32, 0);
    for (let i = 0; i < 18; i++) { dummy.position.set(0, i === 0 ? -100 : (i - ph) * 0.42, 0); dummy.scale.setScalar(1); dummy.updateMatrix(); drops.setMatrixAt(i, dummy.matrix); }
    drops.instanceMatrix.needsUpdate = true;
    const pos = pg.attributes.position.array;
    bursts.forEach((b, j) => {
      const kk = k - j, dt = lt - kk * step;
      if (kk < 0) { b.visible = false; return; } b.visible = true;
      const e = Math.exp(-dt / 0.07);
      b.sp.scale.setScalar(0.3 + 2.2 * (1 - Math.exp(-dt / 0.04))); b.sp.material.opacity = Math.exp(-dt / 0.13);
      b.ring.scale.setScalar(0.1 + dt * 4.5); b.ring.material.opacity = 0.7 * Math.exp(-dt / 0.12); b.ring.lookAt(c.position);
      for (let i = j * 300; i < j * 300 + 300; i++) {
        const th = hash(i * 1.3 + kk) * 6.283, ph2 = Math.acos(2 * hash(i * 2.1 + kk * 3) - 1), sp = 1.2 + hash(i + kk * 7) * 2.6, d = sp * dt * (1 - dt * 0.8);
        pos[i * 3] = Math.sin(ph2) * Math.cos(th) * d; pos[i * 3 + 1] = Math.cos(ph2) * d - 0.6 * dt * dt; pos[i * 3 + 2] = Math.sin(ph2) * Math.sin(th) * d;
      }
    });
    pg.attributes.position.needsUpdate = true;
    pts.material.opacity = 1;
    flashL.intensity = 80 * Math.exp(-ph * step / 0.06);
    beam.material.color.setScalar(1).multiply(new THREE.Color(AMBER)).multiplyScalar(1 + 6 * Math.exp(-ph * step / 0.05));
  };
}

// ---------- LASER: ride the beam into the plasma ----------
function buildLaser() {
  const S = mk("laser");
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 60, 8), emissive(AMBER, 5)); beam.rotation.z = Math.PI / 2; beam.position.x = 30; S.scene.add(beam);
  const drop = new THREE.Mesh(new THREE.SphereGeometry(0.12, 48, 24), metal(0xe0e4ea, 0.06)); S.scene.add(drop);
  const plasma = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 48), plasmaMat(0.55)); S.scene.add(plasma);
  const halo = sprite(1, 0xffffff); S.scene.add(halo);
  const sun = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 32), plasmaMat(0.35)); sun.position.set(-3.2, 1.4, -2); S.scene.add(sun);
  const N = 500, sg = new THREE.BufferGeometry(), sa = new Float32Array(N * 6); sg.setAttribute("position", new THREE.BufferAttribute(sa, 3));
  const streaks = new THREE.LineSegments(sg, new THREE.LineBasicMaterial({ color: 0xffb040, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending })); S.scene.add(streaks);
  const pl = new THREE.PointLight(0xffaa40, 0, 30); S.scene.add(pl);
  S.update = (t) => {
    const ln = L("laser"), hit = wd("laser", 3).t, hot = wd("laser", 4).t, sunW = wd("laser", 7).t;
    const pre = prog(t, ln.t + 0.35, ln.t + 0.6);
    drop.scale.set(1 + 1.6 * eOut3(pre), 1 - 0.7 * eOut3(pre), 1 + 1.6 * eOut3(pre)); drop.visible = t < hit;
    const dt = Math.max(0, t - hit), boom = t >= hit ? 1 - Math.exp(-dt / 0.15) : 0;
    plasma.visible = halo.visible = t >= hit;
    plasma.scale.setScalar(0.12 + 0.62 * boom + 0.03 * kick(t)); plasma.material.uniforms.uT.value = t * 1.5;
    halo.scale.setScalar(1.5 + 4 * boom); halo.material.opacity = 0.35 + 0.5 * Math.exp(-dt / 0.3);
    pl.intensity = t >= hit ? 120 : 0;
    const sunP = eOutBack(prog(t, sunW, sunW + 0.5)); sun.visible = sunP > 0; sun.scale.setScalar(0.03 + 0.06 * sunP); sun.material.uniforms.uT.value = t;
    const c = S.cam;
    if (t < hit) { const p = prog(t, ln.t, hit); c.position.set(lerp(9, 1.1, eIn3(p)), 0.18, 0.35); c.lookAt(0, 0, 0); }
