<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silicon Shield</title>
<style>
  @font-face { font-family: "Archivo"; src: url(../fonts/archivo-var.woff2) format("woff2");
    font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "JBM"; src: url(../fonts/jbmono-var.woff2) format("woff2"); font-weight: 100 800; }
  @font-face { font-family: "Serif"; src: url(../fonts/instrument-serif.woff2) format("woff2"); }
  @font-face { font-family: "Serif"; font-style: italic; src: url(../fonts/instrument-serif-italic.woff2) format("woff2"); }
  @font-face { font-family: "Brico"; src: url(../fonts/bricolage-800.woff2) format("woff2"); font-weight: 800; }
  :root { --bg: #060606; }
  html, body { margin: 0; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; margin: auto; }
  #play { position: fixed; inset: 0; display: grid; place-items: center; color: #eee; font: 600 18px JBM, monospace;
    background: transparent; border: 0; cursor: pointer; letter-spacing: .2em; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="timeline.js"></script>
<script>
"use strict";
const W = 1920, H = 1080;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const TLD = window.TL;

// ------------------------------------------------------------------ palette
const C = {
  bg: "#060606", ink: "#EDE8DE", dim: "rgba(237,232,222,0.42)", faint: "rgba(237,232,222,0.12)",
  ghost: "rgba(237,232,222,0.16)", acc: "#FFA41B", accHot: "#FFCF70", accDeep: "#E46A00",
  paper: "#ECE6D8", paperInk: "#141210", paperDim: "rgba(20,18,16,0.45)",
};

// ------------------------------------------------------------------ math
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut3 = x => 1 - Math.pow(1 - x, 3);
const eIn3 = x => x * x * x;
const eIO3 = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
const BEAT = TLD.beat, BAR = TLD.bar;
const barT = (bar, beat = 0) => bar * BAR + beat * BEAT;

// kick-synchronous pulse (matches the drum pattern in music.py)
const KICKS = (() => {
  const k = [];
  for (let bar = 2; bar < 22; bar++) {
    if (bar < 6) { (bar % 2 === 0 ? [0, 2.5] : [0, 1.75, 2.5]).forEach(b => k.push(barT(bar, b))); }
    else if (bar < 10) { [0, 1, 2, 3].forEach(b => k.push(barT(bar, b))); }
    else if (bar === 10) { [0, 1, 2, 3].forEach(b => k.push(barT(bar, b))); }
    else if (bar === 11) { [0, .5, 1, 1.5, 2, 2.25, 2.5, 2.75].forEach(b => k.push(barT(bar, b))); }
    else if (bar < 20) { [0, 1, 2, 3].forEach(b => k.push(barT(bar, b))); }
    else if (bar === 20) k.push(barT(20));
  }
  k.push(barT(22));
  return k;
})();
function kickPulse(t, tau = 0.11) {
  let best = 0;
  for (const k of KICKS) { if (k <= t && t - k < 0.6) best = Math.max(best, Math.exp(-(t - k) / tau)); }
  return best;
}

// ------------------------------------------------------------------ text
function font(size, { w = 800, s = "normal", fam = "Archivo", it = false } = {}) {
  ctx.font = `${it ? "italic " : ""}${w} ${size}px ${fam}`;
  ctx.fontStretch = s;
}
function mono(size, w = 500) { font(size, { w, fam: "JBM" }); }

function glowText(str, x, y, color, blur = 24, alpha = 1) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.fillStyle = color;
  ctx.shadowColor = color; ctx.shadowBlur = blur;
  ctx.fillText(str, x, y);
  ctx.shadowBlur = 0;
  ctx.fillText(str, x, y);
  ctx.restore();
}

/* Karaoke words. layout: array of rows, each row = list of word indexes.
   style: {size, w, s, fam, it, x, y, lh, align, color, hot, ghost, upper} */
function karaoke(line, t, st) {
  const words = line.words;
  const rows = st.rows || [words.map((_, i) => i)];
  font(st.size, st);
  let y = st.y;
  for (const row of rows) {
    const strs = row.map(i => st.upper ? words[i].text.toUpperCase() : words[i].text);
    const space = ctx.measureText(" ").width * (st.spacing || 1);
    const widths = strs.map(s => ctx.measureText(s).width);
    const total = widths.reduce((a, b) => a + b, 0) + space * (strs.length - 1);
    let x = st.align === "center" ? st.x - total / 2 : st.align === "right" ? st.x - total : st.x;
    row.forEach((wi, k) => {
      const w = words[wi], s = strs[k];
      const appear = w.t - 0.12;
      const p = clamp((t - w.t + 0.04) / Math.max(0.12, Math.min(0.5, w.end - w.t)));
      const active = t >= w.t - 0.04 && t < w.end + 0.12;
      const pop = active ? 1 + 0.06 * Math.exp(-(t - w.t) / 0.08) : 1;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(pop, pop);
      if (t < appear) {
        if (st.ghost !== false) { ctx.globalAlpha = 0.9; ctx.strokeStyle = C.ghost; ctx.lineWidth = 1.2; ctx.strokeText(s, 0, 0); }
      } else {
        // letter wipe: sung part bright, rest ghosted
        const n = s.length, lit = Math.max(1, Math.round(n * eOut3(p)));
        let cx = 0;
        for (let i = 0; i < n; i++) {
          const ch = s[i], cw = ctx.measureText(s.slice(0, i + 1)).width - ctx.measureText(s.slice(0, i)).width;
          if (i < lit) {
            if (active) glowText(ch, cx, 0, st.hot || C.acc, 28);
            else { ctx.fillStyle = st.color || C.ink; ctx.fillText(ch, cx, 0); }
          } else { ctx.strokeStyle = C.ghost; ctx.lineWidth = 1.2; ctx.strokeText(ch, cx, 0); }
          cx += cw;
        }
      }
      ctx.restore();
      x += widths[k] + space;
    });
    y += st.lh || st.size * 1.05;
  }
}

function typeText(str, t, a, cps, x, y) {
  const n = Math.floor(clamp((t - a) * cps, 0, str.length));
  ctx.fillText(str.slice(0, n), x, y);
  if (n < str.length && n > 0 && Math.floor(t * 8) % 2 === 0) ctx.fillRect(x + ctx.measureText(str.slice(0, n)).width + 3, y - 12, 9, 14);
}

const L = name => TLD.lines.find(l => l.scene === name);
const word = (line, i) => line.words[i];

// ------------------------------------------------------------------ chrome / HUD
function drawGrid(alpha = 0.05, step = 60, ox = 0, oy = 0) {
  ctx.save(); ctx.strokeStyle = `rgba(237,232,222,${alpha})`; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = (ox % step); x < W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = (oy % step); y < H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke(); ctx.restore();
}

function cropMarks(color = C.dim, inset = 36, len = 22) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 2;
  ctx.beginPath();
  [[inset, inset, 1, 1], [W - inset, inset, -1, 1], [inset, H - inset, 1, -1], [W - inset, H - inset, -1, -1]].forEach(([x, y, sx, sy]) => {
    ctx.moveTo(x, y + sy * len); ctx.lineTo(x, y); ctx.lineTo(x + sx * len, y);
  });
  ctx.stroke(); ctx.restore();
}

const SCENE_LABEL = {
  intro: "§00 — LOT 7A-0042 / BOOT", tin: "§01 — EUV SOURCE / Sn DROPLET GENERATOR", laser: "§02 — CO₂ DRIVE LASER / PLASMA",
  machine: "§03 — LITHO SCANNER / NXE CLASS", tons: "§04 — LOGISTICS / FREIGHT MANIFEST", line: "§05 — EAR / ECCN 3A090",
  gap: "§05b — SIGNAL LOST", wafer: "§06 — 300 MM WAFER / TARGETING", crown: "§07 — NODE ROADMAP / GAA",
  grid: "§08 — LOAD FLOW / DATACENTER", down: "§09 — TRANSISTORS PER CHIP / LOG", tag: "§10 — END OF LINE", end: "§11 — SHIP",
};
const SCENE_METRIC = {
  intro: ["YIELD", 0.0], tin: ["DROPLETS/S", 50000], laser: ["T_PLASMA °C", 220000], machine: ["MIRRORS", 11],
  tons: ["MASS T", 180], line: ["LICENSE REQ", 1], gap: ["SIGNAL", 0], wafer: ["P(CONFLICT)", 0.31],
  crown: ["NODE NM", 2], grid: ["LOAD GW", 1.2], down: ["TRANSISTORS", 2.08e11], tag: ["EXPORT", 0], end: ["STATUS", 0],
};

function hud(t, scene, light = false) {
  const col = light ? C.paperDim : C.dim;
  cropMarks(col);
  ctx.save();
  mono(14, 500); ctx.fillStyle = col; ctx.textBaseline = "alphabetic";
  ctx.fillText("SILICON SHIELD  ·  TRK 01  ·  128 BPM  ·  F MIN", 70, 66);
  const bar = Math.floor(t / BAR), beat = Math.floor((t % BAR) / BEAT) + 1;
  const tc = `${String(Math.floor(t / 60)).padStart(2, "0")}:${(t % 60).toFixed(2).padStart(5, "0")}`;
  ctx.textAlign = "right";
  ctx.fillText(`BAR ${String(bar + 1).padStart(2, "0")}.${beat}   ${tc}`, W - 70, 66);
  ctx.fillText(TLD.chords[Math.min(21, bar)] || "", W - 70, 88);
  ctx.textAlign = "left";
  ctx.fillText(SCENE_LABEL[scene] || "", 70, H - 56);
  const [k, v] = SCENE_METRIC[scene] || ["", 0];
  ctx.textAlign = "right";
  const jitter = v > 100 ? Math.round(v * (1 + 0.002 * Math.sin(t * 17))) : (v * (1 + 0.03 * Math.sin(t * 9))).toFixed(2);
  ctx.fillText(`${k} ${typeof jitter === "number" ? jitter.toLocaleString("en-US") : jitter}`, W - 70, H - 56);
  // beat ticks
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = i === beat - 1 ? (light ? C.paperInk : C.acc) : col;
    ctx.fillRect(W - 70 - (4 - i) * 16, H - 86, 10, 4);
  }
  ctx.restore();
}

// ------------------------------------------------------------------ post FX
const small = document.createElement("canvas"); small.width = 480; small.height = 270;
const sctx = small.getContext("2d");
const grains = [...Array(6)].map((_, k) => {
  const g = document.createElement("canvas"); g.width = g.height = 256;
  const gx = g.getContext("2d"); const id = gx.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (hash(i * 0.37 + k * 999) - 0.5) * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gx.putImageData(id, 0, 0); return g;
});
function post(t, { bloom = 0.55, grain = 0.07, vig = 0.55 } = {}) {
  // bloom: blurred, brightened downsample added back
  sctx.clearRect(0, 0, 480, 270);
  sctx.filter = "contrast(1.8) brightness(0.85) blur(6px)";
  sctx.drawImage(cv, 0, 0, 480, 270);
  sctx.filter = "none";
  ctx.save();
  ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = bloom;
  ctx.drawImage(small, 0, 0, W, H);
  ctx.restore();
  // vignette
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.0);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(0,0,0,${vig})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // grain
  ctx.save(); ctx.globalCompositeOperation = "overlay"; ctx.globalAlpha = grain;
  const gi = grains[Math.floor(t * 30) % grains.length];
  const ox = Math.floor(hash(Math.floor(t * 30)) * 256), oy = Math.floor(hash(Math.floor(t * 30) + 5) * 256);
  for (let x = -ox; x < W; x += 256) for (let y = -oy; y < H; y += 256) ctx.drawImage(gi, x, y);
  ctx.restore();
}

// ------------------------------------------------------------------ shared drawings
function spark(x, y, r = 10, a = 1) {
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 6);
  g.addColorStop(0, `rgba(255,240,200,${a})`); g.addColorStop(0.15, `rgba(255,190,60,${0.8 * a})`);
  g.addColorStop(1, "rgba(255,140,0,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function flash(x, y, r, a, rays = 24, seed = 0) {
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(255,250,235,${a})`); g.addColorStop(0.2, `rgba(255,200,90,${0.7 * a})`);
  g.addColorStop(1, "rgba(255,120,0,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = `rgba(255,210,120,${0.5 * a})`; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < rays; i++) {
    const an = (i / rays) * Math.PI * 2 + hash(seed + i) * 0.3, len = r * (0.6 + hash(seed + i * 3) * 1.2);
    ctx.moveTo(x + Math.cos(an) * r * 0.1, y + Math.sin(an) * r * 0.1);
    ctx.lineTo(x + Math.cos(an) * len, y + Math.sin(an) * len);
  }
  ctx.stroke(); ctx.restore();
}

function wafer(cx, cy, R, t, { lit = 1, rot = 0, draw = 1, dies = true, color = C.ink, accentDies = 0 } = {}) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
  ctx.strokeStyle = color; ctx.lineWidth = 2;
  // outline with notch at bottom, drawn progressively
  const a0 = Math.PI / 2 + 0.03, a1 = a0 + (Math.PI * 2 - 0.06) * draw;
  ctx.beginPath(); ctx.arc(0, 0, R, a0, a1); ctx.stroke();
  if (draw >= 1) { ctx.beginPath(); ctx.arc(0, R, 10, Math.PI, 0, false); ctx.stroke(); }
  if (dies) {
    const dw = R / 9, dh = R / 11;
    let k = 0;
    const cells = [];
    for (let j = -11; j < 11; j++) for (let i = -9; i < 9; i++) {
      const x = i * dw, y = j * dh;
      const corners = [[x, y], [x + dw, y], [x, y + dh], [x + dw, y + dh]];
      if (corners.every(([a, b]) => a * a + b * b < (R - 8) * (R - 8))) cells.push([x, y, k++]);
    }
    const nLit = Math.floor(cells.length * lit);
    ctx.lineWidth = 1;
    cells.forEach(([x, y, k], idx) => {
      if (idx >= nLit) { ctx.strokeStyle = "rgba(237,232,222,0.07)"; ctx.strokeRect(x + 2, y + 2, dw - 4, dh - 4); return; }
      const fresh = clamp(1 - (nLit - idx) / 18);
      const hot = accentDies > 0 && hash(k * 7.7) < accentDies;
      ctx.strokeStyle = hot ? C.acc : `rgba(237,232,222,${0.28 + 0.5 * fresh})`;
      ctx.strokeRect(x + 2, y + 2, dw - 4, dh - 4);
      if (fresh > 0.2 || hot) { ctx.fillStyle = hot ? "rgba(255,164,27,0.35)" : `rgba(255,164,27,${0.55 * fresh})`; ctx.fillRect(x + 2, y + 2, dw - 4, dh - 4); }
    });
  }
  ctx.restore();
}

// perspective ground plane: world (x, z) -> screen
function proj(x, y, z, cam) {
  const f = cam.f || 900;
  const zz = z - cam.z;
  if (zz <= 1) return null;
  return [W / 2 + (x - cam.x) * f / zz, cam.hy + (cam.y - y) * f / zz];
}

// ------------------------------------------------------------------ scenes
function sIntro(t) {
  drawGrid(0.035);
  const cx = W / 2, cy = H / 2 - 10;
  const dotA = prog(t, 0, 0.5);
  if (t < 0.7) spark(cx, cy + 380, 4 + 3 * Math.sin(t * 20), dotA);
  const d = eIO3(prog(t, 0.35, 1.85));
  const lit = eIn3(prog(t, 1.0, 3.3));
  const zoom = 1 + 2.5 * eIn3(prog(t, 3.35, 3.75));
  ctx.save(); ctx.translate(cx, cy); ctx.scale(zoom, zoom); ctx.translate(-cx, -cy);
  wafer(cx, cy, 360, t, { draw: d, lit, rot: -0.05 + 0.05 * t, dies: d > 0.98 });
  if (d < 1 && d > 0) {
    const an = Math.PI / 2 + 0.03 + (Math.PI * 2 - 0.06) * d - 0.05 + 0.05 * t;
    spark(cx + Math.cos(an) * 360, cy + Math.sin(an) * 360, 6, 1);
  }
  ctx.restore();
  // title
  const ta = barT(1);
  if (t > ta) {
    const title = "SILICON SHIELD";
    const n = Math.floor(clamp((t - ta) / (BEAT / 4)) + 0);
    const shown = Math.min(title.length, Math.floor((t - ta) / (BEAT / 4)) + 1);
    font(150, { w: 900, s: "expanded" }); ctx.textAlign = "center";
    const s = title.slice(0, shown);
    ctx.save(); ctx.shadowColor = "rgba(0,0,0,0.9)"; ctx.shadowBlur = 40; ctx.fillStyle = C.ink; ctx.fillText(s, cx, cy + 50); ctx.restore();
    glowText(s, cx, cy + 50, C.ink, 18);
    if (shown < title.length) glowText(title[shown] || "", cx + ctx.measureText(s).width / 2 + 50, cy + 50, C.acc, 30, 0.6);
    mono(18, 500); ctx.fillStyle = C.acc;
    typeText("A SONG ABOUT THE CHIP RACE  —  PILOT CUT", t, ta + 0.4, 40, cx - 230, cy + 104);
    ctx.textAlign = "left";
  }
}

function sTin(t) {
  const line = L("tin"), lt = t - line.t;
  // collector mirror: concentric ellipses
  ctx.save(); ctx.translate(1340, 560);
  for (let i = 0; i < 16; i++) {
    const r = 120 + i * 34 + 6 * Math.sin(t * 2 + i);
    ctx.strokeStyle = i % 4 === 0 ? `rgba(255,164,27,${0.18 + 0.3 * (1 - i / 16)})` : `rgba(237,232,222,${0.1 + 0.35 * (1 - i / 16)})`; ctx.lineWidth = i % 4 === 0 ? 2 : 1.3;
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.25, r, 0, -1.2, 1.2); ctx.stroke();
  }
  ctx.restore();
  // droplet stream from the top, laser from the right, plasma flash per 16th
  const fx = 1340, fy = 560;
  const step = BEAT / 4;
  const k = Math.floor(lt / step), ph = (lt % step) / step;
  for (let i = 0; i < 14; i++) {
    const y = fy - (i - ph) * 46;
    if (y < 80 || i === 0) continue;
    ctx.fillStyle = "rgba(220,225,230,0.9)"; ctx.beginPath(); ctx.arc(fx, y, 5.5, 0, Math.PI * 2); ctx.fill();
  }
  const a = Math.exp(-ph * 5);
  ctx.save(); ctx.strokeStyle = `rgba(255,164,27,${0.25 + 0.7 * a})`; ctx.lineWidth = 3 + 4 * a;
  ctx.shadowColor = C.acc; ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.moveTo(W, fy - 40); ctx.lineTo(fx + 8, fy); ctx.stroke(); ctx.restore();
  flash(fx, fy, 90 + 140 * a, 0.35 + 0.65 * a, 28, k);
  // big counter
  const fired = Math.floor(Math.max(0, lt) * 50000);
  mono(22, 600); ctx.fillStyle = C.dim;
  ctx.fillText("Sn DROPLETS FIRED", 140, 760);
  font(96, { w: 300, s: "semi-condensed", fam: "JBM" }); ctx.fillStyle = C.ink;
  ctx.fillText(fired.toLocaleString("en-US").padStart(7, "0"), 140, 860);
  mono(16); ctx.fillStyle = C.dim;
  ["λ = 13.5 nm  (extreme ultraviolet)", "droplet ø ≈ 27 µm  ·  v ≈ 70 m/s", "pulse rate 50 kHz"].forEach((s, i) => ctx.fillText(s, 140, 905 + i * 24));
  // lyrics
  karaoke(line, t, { size: 118, w: 800, s: "semi-condensed", x: 136, y: 300, rows: [[0, 1], [2, 3], [4, 5]], lh: 122 });
}

function sLaser(t) {
  const line = L("laser"), lt = t - line.t;
  const cx = 1180, cy = 470;
  const wLaser = word(line, 3), wHot = word(line, 4), wSun = word(line, 7);
  // droplet, pre-pulse flattening, main-pulse plasma
  const pre = prog(t, line.t + 0.35, line.t + 0.6);
  const main = t >= wLaser.t ? Math.exp(-(t - wLaser.t) / 1.6) : 0;
  if (t < wLaser.t) {
    ctx.save(); ctx.translate(cx, cy);
    ctx.fillStyle = "#cfd4da"; ctx.beginPath(); ctx.ellipse(0, 0, 40 + 60 * eOut3(pre), 40 - 30 * eOut3(pre), 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // pre-pulse beam
    const bp = prog(t, line.t, line.t + 0.35);
    ctx.save(); ctx.strokeStyle = C.acc; ctx.lineWidth = 3; ctx.shadowColor = C.acc; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.moveTo(W, cy); ctx.lineTo(lerp(W, cx + 40, eOut3(bp)), cy); ctx.stroke(); ctx.restore();
    mono(16); ctx.fillStyle = C.dim; ctx.fillText("PRE-PULSE  →  PANCAKE", cx + 80, cy - 70);
  } else {
    ctx.save(); ctx.strokeStyle = C.accHot; ctx.lineWidth = 10 * main + 2; ctx.shadowColor = C.acc; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.moveTo(W, cy); ctx.lineTo(cx, cy); ctx.stroke(); ctx.restore();
    flash(cx, cy, 260 + 420 * main + 30 * kickPulse(t), 0.5 + 0.5 * main, 48, 3);
    mono(16); ctx.fillStyle = C.dim; ctx.fillText("MAIN PULSE  →  Sn PLASMA", cx + 80, cy - 70);
  }
  // temperature comparison bars
  if (t > wHot.t - 0.1) {
    const p = eOutExpo(prog(t, wHot.t, wHot.t + 0.9));
    const x0 = 140, y0 = 760;
    mono(16, 600); ctx.fillStyle = C.dim;
    ctx.fillText("SUN · SURFACE  ≈ 5,500 °C", x0, y0 - 14);
    ctx.fillStyle = C.ink; ctx.fillRect(x0, y0, 40, 16);

  mono(16, 700); ctx.fillStyle = C.acc;
  ctx.fillText("TARGET LOCK", W / 2 + R + 90, H / 2 - 16);
  ctx.fillStyle = C.dim; ctx.fillText("300 mm · N2 · 25 WAFERS / FOUP", W / 2 + R + 90, H / 2 + 34);
  if (Math.floor(lt * 4) % 2 === 0) { ctx.fillStyle = C.acc; ctx.fillRect(W / 2 - R - 160, H / 2 - 30, 12, 12); }
  ctx.restore();
  // scan bar sweeping down on each beat
  const sb = (lt / BEAT) % 1, sy = sb * H;
  const g = ctx.createLinearGradient(0, sy - 120, 0, sy);
  g.addColorStop(0, "rgba(255,164,27,0)"); g.addColorStop(1, "rgba(255,164,27,0.16)");
  ctx.fillStyle = g; ctx.fillRect(0, sy - 120, W, 120);
  ctx.fillStyle = "rgba(255,207,112,0.5)"; ctx.fillRect(0, sy, W, 2);
}

function sCrown(t) {
  const line = L("crown"), lt = t - line.t;
  const wNano = word(line, 1), wHold = word(line, 2), wCrown = word(line, 4);
  drawGrid(0.04, 40);
  const cx = W / 2 + 200, cy = 620;
  // gate-all-around transistor (side section)
  ctx.save(); ctx.translate(cx, cy);
  const dp = eOut3(prog(lt, 0, 0.6));
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
  ctx.strokeRect(-420, 120, 840 * dp, 40);                        // substrate
  for (let i = 0; i < 3; i++) {                                    // nanosheets
    const y = 60 - i * 70;
    ctx.strokeStyle = C.ink; ctx.strokeRect(-360, y, 720 * dp, 26);
  }
  // gate wraps the sheets
  const gp = eOut3(prog(t, wNano.t, wNano.t + 0.6));
  ctx.save(); ctx.strokeStyle = C.acc; ctx.lineWidth = 3; ctx.shadowColor = C.acc; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.moveTo(-90, 120); ctx.lineTo(-90, 120 - 290 * gp); ctx.lineTo(90, 120 - 290 * gp); ctx.lineTo(90, 120); ctx.stroke();
  for (let i = 0; i < 3; i++) { const y = 60 - i * 70; ctx.strokeRect(-90, y - 12, 180 * gp, 50); }
  ctx.restore();
  mono(14, 600); ctx.fillStyle = C.dim;
  ctx.fillText("SOURCE", -380, 200); ctx.fillText("GATE (ALL-AROUND)", -80, -210); ctx.fillText("DRAIN", 320, 200);
  ctx.restore();
  // node countdown on "nanometers"
  const nodes = ["7", "5", "3", "2"];
  const ni = Math.min(3, Math.max(0, Math.floor((t - wNano.t) / (BEAT / 2))));
  if (t > wNano.t - 0.2) {
    font(300, { w: 900, s: "extra-condensed" }); ctx.fillStyle = C.ink; ctx.textAlign = "right";
    ctx.fillText(nodes[t < wNano.t ? 0 : ni], 560, 820);
    font(90, { w: 700, s: "condensed" }); ctx.textAlign = "left"; glowText("nm", 572, 820, C.acc, 20);
    mono(14); ctx.fillStyle = C.dim; ctx.fillText(`N${nodes.slice(0, ni + 1).join(" → N")}`, 300, 860);
    // caliper
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(300, 880); ctx.lineTo(680, 880);
    for (let i = 0; i <= 20; i++) { ctx.moveTo(300 + i * 19, 880); ctx.lineTo(300 + i * 19, 880 - (i % 5 ? 8 : 18)); } ctx.stroke();
  }
  // crown of circuit traces
  if (t > wHold.t - 0.1) {
    const p = eOutBack(prog(t, wCrown.t - 0.25, wCrown.t + 0.35));
    const cp = prog(t, wHold.t, wCrown.t + 0.4);
    ctx.save(); ctx.translate(cx, 250 - 30 * p); ctx.scale(0.6 + 0.4 * p, 0.6 + 0.4 * p);
    const pts = [[-200, 90], [-200, -10], [-110, 50], [-55, -70], [0, 30], [55, -70], [110, 50], [200, -10], [200, 90], [-200, 90]];
    ctx.strokeStyle = C.acc; ctx.lineWidth = 5; ctx.shadowColor = C.acc; ctx.shadowBlur = 24; ctx.beginPath();
    const n = (pts.length - 1) * eIO3(cp);
    ctx.moveTo(...pts[0]);
    for (let i = 0; i < pts.length - 1; i++) { const q = clamp(n - i); if (q <= 0) break; ctx.lineTo(lerp(pts[i][0], pts[i + 1][0], q), lerp(pts[i][1], pts[i + 1][1], q)); }
    ctx.stroke(); ctx.shadowBlur = 0;
    [[-200, -10], [-55, -70], [55, -70], [200, -10]].forEach(([x, y], i) => { if (n > i * 2 + 1) { ctx.fillStyle = C.accHot; ctx.beginPath(); ctx.arc(x, y - 16, 10, 0, Math.PI * 2); ctx.fill(); } });
    ctx.restore();
  }
  karaoke(line, t, { size: 104, w: 800, s: "semi-condensed", x: 136, y: 250, rows: [[0, 1]] });
  karaoke(line, t, { size: 104, w: 800, s: "semi-condensed", x: 136, y: 1000, rows: [[2, 3, 4]], ghost: t > wHold.t - 0.4 });
}

function sGrid(t) {
  const line = L("grid"), lt = t - line.t;
  const cam = { x: 0, y: 95, z: lt * 170, hy: 600, f: 950 };
  // ground grid
  ctx.save(); ctx.strokeStyle = "rgba(237,232,222,0.16)"; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = -3000; x <= 3000; x += 150) { const a = proj(x, 0, cam.z + 2, cam), b = proj(x, 0, cam.z + 6000, cam); if (a && b) { ctx.moveTo(...a); ctx.lineTo(...b); } }
  const z0 = Math.floor(cam.z / 150) * 150;
  for (let z = z0 + 150; z < cam.z + 6000; z += 150) { const a = proj(-3000, 0, z, cam), b = proj(3000, 0, z, cam); if (a && b) { ctx.moveTo(...a); ctx.lineTo(...b); } }
  ctx.stroke(); ctx.restore();
  // corn rows: regular furrows, fading with distance
  for (let band = 0; band < 4; band++) {
    const zn = 150 + band * 650, zf = zn + 650;
    ctx.strokeStyle = `rgba(237,232,222,${0.42 - band * 0.09})`; ctx.lineWidth = 1.3 - band * 0.2; ctx.beginPath();
    for (let r = -16; r <= 16; r++) {
      if (Math.abs(r) < 2) continue;
      for (let z = Math.ceil((cam.z + zn) / 55) * 55; z < cam.z + zf; z += 55) {
        const x = r * 70 + 10 * Math.sin(z * 0.01), hgt = 26 + 14 * hash(r * 13 + z);
        const a = proj(x, 0, z, cam), b = proj(x + 5 * Math.sin(t * 2.2 + z * 0.02 + r), hgt, z, cam);
        if (a && b) { ctx.moveTo(...a); ctx.lineTo(...b); }
      }
    }
    ctx.stroke();
  }
  // datacenter blocks rising on the beat at the end of the road
  const blocks = 7;
  for (let i = 0; i < blocks; i++) {
    const ta = line.t + i * BEAT * 0.5;
    const rise = eOutBack(prog(t, ta, ta + 0.35));
    if (rise <= 0) continue;
    const bx = (i - 3.5) * 330 + 15, bz = cam.z + 1500, bw = 300, bh = 250 * rise, bd = 420;
    const P = (x, y, z) => proj(bx + x, y, bz + z, cam);
    const fr = [P(0, 0, 0), P(bw, 0, 0), P(bw, bh, 0), P(0, bh, 0)];
    const bk = [P(0, bh, bd), P(bw, bh, bd)];
    if (fr.some(p => !p)) continue;
    ctx.fillStyle = "rgba(6,6,6,0.94)"; ctx.beginPath(); fr.forEach((p, k) => k ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(...fr[3]); ctx.lineTo(...bk[0]); ctx.lineTo(...bk[1]); ctx.lineTo(...fr[2]); ctx.stroke();
    // roof fans
    for (let f = 0; f < 3; f++) { const c = P(50 + f * 100, bh, bd * 0.5); if (c) { ctx.beginPath(); ctx.ellipse(c[0], c[1], 22, 6, 0, 0, Math.PI * 2); ctx.stroke(); } }
    // rack lights flicker
    for (let r = 0; r < 5; r++) for (let c = 0; c < 8; c++) {
      if (hash(i * 50 + r * 7 + c + Math.floor(t * 6)) < 0.45) continue;
      const p = P(16 + c * 35, 18 + r * 36 * rise, -1); if (!p || r * 36 * rise > bh - 30) continue;
      ctx.fillStyle = C.acc; ctx.fillRect(p[0], p[1] - 5, 16, 4);
    }
  }
  // power lines with pulses
  const towers = [-1800, -1200, -600];
  [-1, 1].forEach(side => {
    let prev = null;
    for (let k = 0; k < 6; k++) {
      const z = cam.z + 300 + k * 380, x = side * (1200 - k * 150);
      const base = proj(x, 0, z, cam), top = proj(x, 260, z, cam);
      if (!base || !top) continue;
      ctx.strokeStyle = "rgba(237,232,222,0.5)"; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(base[0] - 14 * (top[1] - base[1]) / -260, base[1]); ctx.lineTo(...top); ctx.lineTo(base[0] + 14 * (top[1] - base[1]) / -260, base[1]); ctx.stroke();
      if (prev) {
        ctx.beginPath(); ctx.moveTo(...prev);
        const mx = (prev[0] + top[0]) / 2, my = (prev[1] + top[1]) / 2 + 20;
        ctx.quadraticCurveTo(mx, my, ...top); ctx.stroke();
        const ph = ((t / BEAT) % 1);
        const q = ph, x2 = (1 - q) * (1 - q) * prev[0] + 2 * (1 - q) * q * mx + q * q * top[0], y2 = (1 - q) * (1 - q) * prev[1] + 2 * (1 - q) * q * my + q * q * top[1];
        spark(x2, y2, 3);
      }
      prev = top;
    }
  });
  // load meter
  const gw = lerp(0, 1.2, eOut3(prog(t, line.t, line.end)));
  mono(18, 600); ctx.fillStyle = C.dim; ctx.fillText("SITE LOAD", W - 520, 900);
  font(90, { w: 300, fam: "JBM" }); ctx.fillStyle = C.ink; ctx.fillText(`${gw.toFixed(2)} GW`, W - 520, 990);
  ctx.fillStyle = C.faint; ctx.fillRect(W - 520, 1006, 380, 6); ctx.fillStyle = C.acc; ctx.fillRect(W - 520, 1006, 380 * gw / 1.2, 6);
  karaoke(line, t, { size: 170, w: 900, s: "expanded", x: W / 2, y: 260, align: "center", rows: [[0]], upper: true });
  karaoke(line, t, { size: 80, w: 700, s: "normal", x: W / 2, y: 370, align: "center", rows: [[1, 2, 3, 4]] });
}

function sDown(t) {
  const line = L("down"), lt = t - line.t;
  const wDown = word(line, 4);
  // transistor count, log scale (approximate milestones)
  const data = [[1971, 3.36], [1978, 4.46], [1985, 5.44], [1993, 6.49], [2000, 7.62], [2006, 8.46], [2012, 9.6], [2016, 10.18], [2020, 10.73], [2024, 11.32], [2026, 11.6]];
  const X = yr => 200 + (yr - 1971) * 26, Y = lg => 980 - (lg - 3) * 92;
  const camY = Math.max(0, (eIn3(prog(t, wDown.t, line.end)) * 900));
  ctx.save(); ctx.translate(0, camY);
  ctx.strokeStyle = C.faint; ctx.lineWidth = 1; mono(13); ctx.fillStyle = C.dim;
  for (let lg = 3; lg <= 12; lg++) { ctx.beginPath(); ctx.moveTo(200, Y(lg)); ctx.lineTo(1720, Y(lg)); ctx.stroke(); ctx.fillText(`1e${lg}`, 140, Y(lg) + 4); }
  [1971, 1980, 1990, 2000, 2010, 2020, 2026].forEach(y => ctx.fillText(String(y), X(y) - 18, 1010));
  const p = eIO3(prog(lt, 0, 2.3));
  const n = (data.length - 1) * p;
  ctx.save(); ctx.strokeStyle = C.acc; ctx.lineWidth = 4; ctx.shadowColor = C.acc; ctx.shadowBlur = 20; ctx.beginPath();
  ctx.moveTo(X(data[0][0]), Y(data[0][1])); let hx = X(data[0][0]), hy = Y(data[0][1]);
  for (let i = 0; i < data.length - 1; i++) { const q = clamp(n - i); if (q <= 0) break; hx = lerp(X(data[i][0]), X(data[i + 1][0]), q); hy = lerp(Y(data[i][1]), Y(data[i + 1][1]), q); ctx.lineTo(hx, hy); }
  // after "down": the line goes vertical, off the chart
  if (t > wDown.t) { const up = eIn3(prog(t, wDown.t, line.end)) * 1600; ctx.lineTo(hx + 20, hy - up); hy -= up; hx += 20; }
  ctx.stroke(); ctx.restore();
  spark(hx, hy, 9);
  data.forEach(([yr, lg], i) => { if (i <= n) { ctx.fillStyle = C.ink; ctx.fillRect(X(yr) - 3, Y(lg) - 3, 6, 6); } });
  mono(13, 600); ctx.fillStyle = C.dim;
  if (n > 0) ctx.fillText("4004 · 2,300", X(1971) + 10, Y(3.36) - 12);
  if (n > 8) ctx.fillText("GPU · 208 B", X(2024) - 140, Y(11.32) - 16);
  ctx.restore();
  mono(16, 600); ctx.fillStyle = C.dim; ctx.fillText("TRANSISTORS PER CHIP (LOG)", 200, 120);
  karaoke(line, t, { size: 110, w: 800, s: "semi-condensed", x: 200, y: 280, rows: [[0, 1], [2, 3]], lh: 116 });
  if (t > wDown.t - 0.05) {
    const flip = eIO3(prog(t, wDown.t + 0.5, wDown.t + 0.9));
    ctx.save(); ctx.translate(1330, 560); ctx.scale(1, Math.cos(flip * Math.PI)); font(330, { w: 900, s: "condensed" }); ctx.textAlign = "center";
    glowText("DOWN", 0, 110, flip > 0.5 ? C.acc : C.ink, 26); ctx.restore();
  }
}

// 8-bit text: draw at low resolution, scale up without smoothing
const pix = document.createElement("canvas"); pix.width = 240; pix.height = 135;
const pctx = pix.getContext("2d");
function pixelText(lines, t, fade = 1) {
  pctx.clearRect(0, 0, 240, 135);
  pctx.fillStyle = C.acc; pctx.textAlign = "center";
  lines.forEach(([s, size, y]) => { pctx.font = `900 ${size}px Archivo`; pctx.fillText(s, 120, y); });
  ctx.save(); ctx.imageSmoothingEnabled = false; ctx.globalAlpha = fade; ctx.drawImage(pix, 0, 0, W, H); ctx.restore();
}

function sTag(t) {
  const line = L("tag");
  const lt = t - line.t;
  const go = barT(21);
  if (t < go) {
    wafer(W / 2, H / 2, 260, t, { lit: 1, rot: lt * 0.1 });
    karaoke(line, t, { size: 120, fam: "Serif", it: true, w: 400, x: W / 2, y: 900, align: "center", rows: [[0, 1]], ghost: true });
    mono(16); ctx.fillStyle = C.dim; ctx.textAlign = "center"; ctx.fillText("( weapon now )", W / 2, 960); ctx.textAlign = "left";
  } else {
    // game over: descending pixel text, then collapse to a dot
    const p = prog(t, go, barT(22));
    const drop = Math.floor(p * 8);
    pixelText([["EXPORT", 30, 52 + drop * 2], ["RESTRICTED", 20, 80 + drop * 2]], t, clamp(1 - prog(t, go + 1.2, barT(22))));
    const shrink = prog(t, go + 1.3, barT(22));
    if (shrink > 0) spark(W / 2, H / 2, 6 * (1 - shrink) + 2, 1);
  }
}

function sEnd(t) {
  const lt = t - barT(22);
  const f = Math.exp(-lt / 0.18);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  font(190, { w: 900, s: "expanded" }); ctx.textAlign = "center";
  glowText("SILICON", W / 2, H / 2 - 30, C.ink, 6);
  glowText("SHIELD", W / 2, H / 2 + 160, C.acc, 18);
  mono(18, 600); ctx.fillStyle = C.dim;
  ctx.fillText("ECCN 3A090   ·   NOT FOR EXPORT   ·   FRAGILE: CONTAINS THE FUTURE", W / 2, H / 2 + 240);
  ctx.textAlign = "left";
  // shipping label corner
  ctx.strokeStyle = C.dim; ctx.lineWidth = 1.5; ctx.strokeRect(W - 380, 120, 260, 120);
  mono(13, 600); ctx.fillStyle = C.dim; ["FROM: HSINCHU, TW", "VIA:  VELDHOVEN, NL", "TO:   EVERYONE"].forEach((s, i) => ctx.fillText(s, W - 364, 152 + i * 28));
  if (f > 0.01) { ctx.fillStyle = `rgba(255,250,240,${f})`; ctx.fillRect(0, 0, W, H); }
  const out = prog(t, TLD.duration - 1.4, TLD.duration - 0.1);
  if (out > 0) { ctx.fillStyle = `rgba(6,6,6,${out})`; ctx.fillRect(0, 0, W, H); }
}

// ------------------------------------------------------------------ schedule
const SCHEDULE = [
  ["intro", 0, barT(2), sIntro], ["tin", barT(2), barT(4), sTin], ["laser", barT(4), barT(6), sLaser],
  ["machine", barT(6), barT(8), sMachine], ["tons", barT(8), barT(10), sTons], ["line", barT(10), barT(11, 3), sLine],
  ["gap", barT(11, 3), barT(12), sGap], ["wafer", barT(12), barT(14), sWafer], ["crown", barT(14), barT(16), sCrown],
  ["grid", barT(16), barT(18), sGrid], ["down", barT(18), barT(20), sDown], ["tag", barT(20), barT(22), sTag],
  ["end", barT(22), 1e9, sEnd],
];

// picture follows the audio's time effects: tape stop into the drop gap, stutter into the tag
function visTime(t) {
  const ts = barT(11, 3), td = 0.3;
  if (t >= ts - td && t < ts) { const p = (t - (ts - td)) / td; return ts - td + td * (1 - Math.pow(1 - p, 2.5)) / 2.5; }
  const sa = barT(19, 3), sb = barT(20), sl = BEAT / 4;
  if (t >= sa && t < sb) return sa + ((t - sa) % sl);
  return t;
}

function renderAt(tReal) {
  const t = visTime(tReal);
  const stut = tReal >= barT(19, 3) && tReal < barT(20) ? Math.floor((tReal - barT(19, 3)) / (BEAT / 4)) : -1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const [name, a, b, fn] = SCHEDULE.find(([, a, b]) => t >= a && t < b) || SCHEDULE[SCHEDULE.length - 1];
  const chorus = t >= barT(12) && t < barT(20);
  // subtle camera punch on every kick in the chorus
  const k = chorus ? kickPulse(t, 0.09) : 0;
  ctx.save();
  if (k > 0 && name !== "wafer") { ctx.translate(W / 2, H / 2); ctx.scale(1 + 0.012 * k, 1 + 0.012 * k); ctx.translate(-W / 2, -H / 2); }
  const mode = fn(t);
  ctx.restore();
  if (name !== "line") hud(t, name, mode === "light");
  // cut flashes on section downbeats
  [barT(2), barT(10), barT(14), barT(16), barT(18), barT(20)].forEach(c => {
    const f = t >= c ? Math.exp(-(t - c) / 0.05) : 0;
    if (f > 0.02) { ctx.fillStyle = `rgba(255,245,225,${0.35 * f})`; ctx.fillRect(0, 0, W, H); }
  });
  if (stut >= 0) { // glitch: each repeat shifts and tints
    ctx.save(); ctx.globalCompositeOperation = "difference"; ctx.fillStyle = `rgba(255,164,27,${0.08 * stut})`; ctx.fillRect(0, 0, W, H); ctx.restore();
    ctx.drawImage(cv, 0, 0, W, H / 2, (stut % 2 ? 14 : -14) * stut, 0, W, H / 2);
  }
  post(t, { bloom: mode === "light" || name === "line" ? 0.12 : 0.32, grain: name === "line" ? 0.1 : 0.07, vig: name === "line" ? 0.35 : 0.6 });
}

window.renderAt = renderAt;
window.ready = Promise.all([
  document.fonts.load("900 100px Archivo"), document.fonts.load("500 20px JBM"),
  document.fonts.load("400 40px Serif"), document.fonts.load("italic 400 40px Serif"),
]).then(() => document.fonts.ready).then(() => { renderAt(0); return true; });

// live preview with audio when opened in a browser (?play)
if (location.search.includes("play")) {
  const btn = document.createElement("button"); btn.id = "play"; btn.textContent = "▶  PLAY"; document.body.appendChild(btn);
  const audio = new Audio("../audio/silicon_shield.mp3");
  btn.onclick = () => { btn.remove(); audio.play(); const loop = () => { renderAt(audio.currentTime); if (!audio.ended) requestAnimationFrame(loop); }; loop(); };
}
