# Temporary: checks that the site loads from public CDNs that serve this repo. Removed after one run.
name: Check public link
on:
  push:
    paths: ['.github/workflows/check-link.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for base in "https://rawcdn.githack.com/raycoding1-collab/ai-race-reckoning/e9c3b58c8ba89784f284ae1933284c503060b568/anime" \
                      "https://raw.githack.com/raycoding1-collab/ai-race-reckoning/ccr-47da3b15-xdetkd/anime" \
                      "https://cdn.statically.io/gh/raycoding1-collab/ai-race-reckoning/e9c3b58c8ba89784f284ae1933284c503060b568/anime"; do
            echo "== $base"
            for p in "" index.html "assets/site.css?v=5f83dead91" "assets/site.js?v=5f83dead91" img/totoro.webp img/akira.webp img/one-piece-flag.webp favicon.svg; do
              curl -sL -o /tmp/out -w "%{http_code} %{content_type} %{size_download} /$p\n" -m 30 "$base/$p" || echo "fail /$p"
            done
            curl -sL -m 30 "$base/index.html" | grep -o '<title>[^<]*</title>' | head -1
          done
